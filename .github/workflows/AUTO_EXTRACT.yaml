name: 自动编译上游新版本

on:
  schedule:
    # 北京时间4:00
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      matrix:
        include:
          - name: amd64
          - name: arm64
    outputs:
      has_new_version: ${{ steps.check.outputs.has_new_version }}
      latest_version: ${{ steps.upstream.outputs.latest }}
      version_clean: ${{ steps.upstream.outputs.version_clean }}
    steps:
      - name: 获取上游最新 Release 版本
        id: upstream
        env:
          REPO: dushixiang/next-terminal
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/$REPO/releases/latest --jq .tag_name)
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "上游最新版本: ${LATEST}"
          VERSION_CLEAN="${LATEST#v}"
          echo "version_clean=${VERSION_CLEAN}" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: 恢复上次编译的版本缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: .last-version
          key: upstream-version-${{ github.run_id }}
          restore-keys: |
            upstream-version-

      - name: 读取已编译版本并判断是否需要编译
        id: check
        run: |
          if [ -f .last-version ]; then
            CACHED_VERSION=$(cat .last-version)
            echo "cached_version=${CACHED_VERSION}" >> $GITHUB_OUTPUT
          else
            CACHED_VERSION="none"
            echo "cached_version=none" >> $GITHUB_OUTPUT
          fi
          
          if [ "$CACHED_VERSION" != "${{ steps.upstream.outputs.latest }}" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
            echo "发现新版本: ${{ steps.upstream.outputs.latest }} (缓存版本: ${CACHED_VERSION})"
          else
            echo "has_new_version=false" >> $GITHUB_OUTPUT
            echo "无新版本，跳过编译 (当前版本: ${CACHED_VERSION})"
          fi

      - name: 安装基础工具包
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo wget zip unzip

      - name: 打包压缩包
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          echo "发现新版本 ${{ steps.upstream.outputs.latest }}，开始打包 ${{ matrix.name }}..."

          # 下载umoic
          wget https://github.com/opencontainers/umoci/releases/download/v0.6.0/umoci.linux.amd64
          chmod +x umoci.linux.amd64
          mv umoci.linux.amd64 umoci
          
          # 克隆镜像
          skopeo copy --override-arch ${{ matrix.name }} \
          docker://registry.cn-beijing.aliyuncs.com/dushixiang/next-terminal:${{ steps.upstream.outputs.latest }} \
          oci:next-terminal-${{ matrix.name }}:${{ steps.upstream.outputs.latest }}

          # 提取rootfs
          ./umoci raw unpack --image next-terminal-${{ matrix.name }}:${{ steps.upstream.outputs.latest }} rootfs-${{ matrix.name }}

          # 创建最终提取的目录
          mkdir -p output/${{ matrix.name }}
          
          # 提取rootfs内的二进制文件
          cp -a "next-terminal-${{ matrix.name }}/usr/local/next-terminal" output/${{ matrix.name }}/

          # 打包
          cd output/${{ matrix.name }}/next-terminal
          mkdir data
          curl -sSL https://f.typesafe.cn/next-terminal/config.yaml > config.yaml
          cd ../
          zip -r next-terminal_${{ steps.upstream.outputs.latest }}_${{ matrix.name }}.zip next-terminal

      - name: 上传产物作为 Artifact
        if: steps.check.outputs.has_new_version == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: next-terminal-${{ matrix.name }}-${{ steps.upstream.outputs.latest }}
          path: output/${{ matrix.name }}/next-terminal_*.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.has_new_version == 'true'
    permissions:
      contents: write
    steps:
      - name: 下载所有编译产物
        uses: actions/download-artifact@v4
      - name: 获取版本信息
        id: version
        run: |
          # 从第一个 artifact 目录提取版本
          for dir in next-terminal-*/; do
            if [ -d "$dir" ]; then
              filename=$(ls "$dir"/*.zip 2>/dev/null | head -1)
              if [ -n "$filename" ]; then
                # 提取版本号，例如 next-terminal_v1.2.3_amd64.zip -> v1.2.3
                VERSION=$(echo "$filename" | grep -oP 'v\d+\.\d+\.\d+' | head -1)
                if [ -n "$VERSION" ]; then
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "提取到版本: $VERSION"
                  break
                fi
              fi
            fi
          done
          
          if [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "无法提取版本号，使用 needs.build 中的版本"
            echo "version=${{ needs.build.outputs.latest_version }}" >> $GITHUB_OUTPUT
          fi
          
      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.version }}"
          echo "检查 tag: $TAG_NAME 是否存在..."
          
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME 已存在，跳过创建"
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME 不存在，将创建"
          fi
      - name: 获取编译时间
        id: build_time
        run: echo "compile_time=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      - name: 创建 Release 并上传所有产物
        if: steps.check_release.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            🤖 自动编译版本: ${{ steps.version.outputs.version }}
            
            ## 📦 包含架构
            - amd64 (x86_64)
            - arm64 (ARM64)
            
            ## ⏰ 编译时间
            ${{ steps.build_time.outputs.compile_time }}

          draft: false
          prerelease: false
          files: |
            */next-terminal_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
